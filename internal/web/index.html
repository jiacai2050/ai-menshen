<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview - ai-menshen</title>
    <link rel="stylesheet" href="/assets/pico.min.css">
    <link rel="stylesheet" href="/assets/app.css">
    <script defer src="/assets/alpine.min.js"></script>
    <script src="/assets/chart.min.js"></script>
</head>
<body x-data="overviewPage()">
    <header class="container site-header">
        <nav>
            <ul>
                <li><strong class="nav-brand">门神 ai-menshen</strong></li>
                <li><a href="/" class="nav-item active">Overview</a></li>
                <li><a href="/logs" class="nav-item">Audit Logs</a></li>
            </ul>
            <ul>
                <li><a href="https://github.com/jiacai2050/ai-menshen" target="_blank" class="secondary">GitHub</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <!-- Global Controls -->
        <div class="header-controls">
            <label for="period-select">Period:</label>
            <select id="period-select" x-model="days" @change="refreshData()">
                <option value="7">Last 7 Days</option>
                <option value="14">Last 14 Days</option>
                <option value="30">Last 30 Days</option>
                <option value="90">Last 90 Days</option>
            </select>
        </div>

        <!-- Metric Cards -->
        <div class="grid grid-stats">
            <div class="card">
                <h5>Total Requests</h5>
                <div class="value" x-text="formatNumber(summary.total_requests)"></div>
            </div>
            <div class="card">
                <h5>Cache Hit Rate</h5>
                <div class="value" x-text="hitRate()"></div>
            </div>
            <div class="card">
                <h5>Total Tokens</h5>
                <div class="value" x-text="formatNumber(summary.total_tokens)"></div>
            </div>
            <div class="card">
                <h5>Cached Tokens</h5>
                <div class="value" x-text="formatNumber(summary.cached_tokens)"></div>
            </div>
        </div>

        <!-- Trend Charts Grid -->
        <div class="grid" style="margin-bottom: 2rem;">
            <section style="margin-bottom: 0;">
                <h5>Requests Trend</h5>
                <div class="chart-card">
                    <canvas id="requestsChart"></canvas>
                </div>
            </section>
            <section style="margin-bottom: 0;">
                <h5>Tokens Trend</h5>
                <div class="chart-card">
                    <canvas id="usageChart"></canvas>
                </div>
            </section>
        </div>

        <!-- Provider Breakdown -->
        <section>
            <h5>Provider Breakdown</h5>
            <figure>
                <table role="grid">
                    <thead>
                        <tr>
                            <th>Provider</th>
                            <th>Requests</th>
                            <th>Cache Hits</th>
                            <th>Total Tokens</th>
                            <th>Cached Tokens</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-if="providers.length === 0">
                            <tr><td colspan="5" style="text-align: center; color: #888;">No provider usage data yet</td></tr>
                        </template>
                        <template x-for="p in providers" :key="p.provider">
                            <tr>
                                <td style="font-weight: 500;" x-text="p.provider"></td>
                                <td x-text="formatNumber(p.request_count)"></td>
                                <td x-text="formatNumber(p.cache_hits)"></td>
                                <td x-text="formatNumber(p.total_tokens)"></td>
                                <td x-text="formatNumber(p.cached_tokens)"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </figure>
        </section>

        <!-- Model Breakdown -->
        <section>
            <h5>Model Breakdown</h5>
            <figure>
                <table role="grid">
                    <thead>
                        <tr>
                            <th>Model</th>
                            <th>Requests</th>
                            <th>Cache Hits</th>
                            <th>Total Tokens</th>
                            <th>Cached Tokens</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template x-if="models.length === 0">
                            <tr><td colspan="5" style="text-align: center; color: #888;">No model usage data yet</td></tr>
                        </template>
                        <template x-for="m in models" :key="m.model">
                            <tr>
                                <td style="font-weight: 500;" x-text="m.model"></td>
                                <td x-text="formatNumber(m.request_count)"></td>
                                <td x-text="formatNumber(m.cache_hits)"></td>
                                <td x-text="formatNumber(m.total_tokens)"></td>
                                <td x-text="formatNumber(m.cached_tokens)"></td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </figure>
        </section>
    </main>

    <footer class="container" style="margin-top: 4rem; padding: 2rem 0; border-top: 1px solid var(--pico-muted-border-color);">
        <div class="grid">
            <div>
                <small><strong>ai-menshen</strong></small><br>
                <small class="secondary">The local-first AI door guardian.</small>
            </div>
            <div style="text-align: right;">
                <small class="secondary">
                    Built with Go & Modern SQLite. 
                    <a href="https://github.com/jiacai2050/ai-menshen" target="_blank" style="margin-left: 0.5rem;">GitHub</a>
                </small><br>
                <small style="color: #198754;">● Connected & Secure</small>
            </div>
        </div>
    </footer>

    <script>
        function overviewPage() {
            return {
                days: 14,
                summary: {},
                models: [],
                providers: [],
                daily: [],
                requestsChart: null,
                usageChart: null,
                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    if (urlParams.has('days')) {
                        const d = parseInt(urlParams.get('days'), 10);
                        if ([7, 14, 30, 90].includes(d)) this.days = d;
                    }
                    if (window.matchMedia) {
                        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                            this.renderCharts();
                        });
                    }
                    this.refreshData();
                },
                refreshData() {
                    const params = '?days=' + this.days;
                    fetch('/__report/summary' + params).then(res => res.json()).then(data => this.summary = data || {});
                    fetch('/__report/models' + params).then(res => res.json()).then(data => this.models = data || []);
                    fetch('/__report/providers' + params).then(res => res.json()).then(data => this.providers = data || []);
                    fetch('/__report/daily' + params).then(res => res.json()).then(data => {
                        this.daily = data || [];
                        this.renderCharts();
                    });
                },
                renderCharts() {
                    if (!this.daily || this.daily.length === 0) return;
                    this.renderRequestsChart();
                    this.renderTokensChart();
                },
                renderRequestsChart() {
                    const canvas = document.getElementById('requestsChart');
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    if (this.requestsChart) this.requestsChart.destroy();

                    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    const textColor = isDark ? '#94a3b8' : '#64748b';
                    const gridColor = isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.06)';
                    const directBg = isDark ? 'rgba(56, 189, 248, 0.35)' : '#cce5ff';
                    const directBorder = isDark ? '#38bdf8' : '#0066cc';
                    const cacheBg = isDark ? 'rgba(52, 211, 153, 0.35)' : '#d1e7dd';
                    const cacheBorder = isDark ? '#34d399' : '#198754';

                    this.requestsChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: this.daily.map(d => d.date),
                            datasets: [{
                                label: 'Direct Requests',
                                data: this.daily.map(d => Math.max(0, d.request_count - (d.cache_hits || 0))),
                                backgroundColor: directBg,
                                borderColor: directBorder,
                                borderWidth: 1
                            }, {
                                label: 'Cache Hits',
                                data: this.daily.map(d => d.cache_hits || 0),
                                backgroundColor: cacheBg,
                                borderColor: cacheBorder,
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                x: {
                                    stacked: true,
                                    grid: { display: false },
                                    ticks: { color: textColor }
                                },
                                y: {
                                    stacked: true,
                                    beginAtZero: true,
                                    grid: { color: gridColor },
                                    ticks: {
                                        color: textColor,
                                        precision: 0
                                    }
                                }
                            },
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: textColor }
                                }
                            }
                        }
                    });
                },
                renderTokensChart() {
                    const canvas = document.getElementById('usageChart');
                    if (!canvas) return;
                    const ctx = canvas.getContext('2d');
                    if (this.usageChart) this.usageChart.destroy();

                    const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
                    const textColor = isDark ? '#94a3b8' : '#64748b';
                    const gridColor = isDark ? 'rgba(255, 255, 255, 0.08)' : 'rgba(0, 0, 0, 0.06)';
                    const promptBg = isDark ? 'rgba(168, 85, 247, 0.35)' : '#ede9fe';
                    const promptBorder = isDark ? '#c084fc' : '#7c3aed';
                    const compBg = isDark ? 'rgba(52, 211, 153, 0.35)' : '#d1e7dd';
                    const compBorder = isDark ? '#34d399' : '#198754';

                    this.usageChart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: this.daily.map(d => d.date),
                            datasets: [{
                                label: 'Prompt Tokens',
                                data: this.daily.map(d => d.prompt_tokens),
                                backgroundColor: promptBg,
                                borderColor: promptBorder,
                                borderWidth: 1
                            }, {
                                label: 'Completion Tokens',
                                data: this.daily.map(d => d.completion_tokens),
                                backgroundColor: compBg,
                                borderColor: compBorder,
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                x: {
                                    stacked: true,
                                    grid: { display: false },
                                    ticks: { color: textColor }
                                },
                                y: {
                                    stacked: true,
                                    beginAtZero: true,
                                    grid: { color: gridColor },
                                    ticks: { color: textColor }
                                }
                            },
                            plugins: {
                                legend: {
                                    position: 'bottom',
                                    labels: { color: textColor }
                                }
                            }
                        }
                    });
                },
                hitRate() {
                    if (!this.summary.total_requests) return '0%';
                    return ((this.summary.cache_hits / this.summary.total_requests) * 100).toFixed(1) + '%';
                },
                formatNumber(n) {
                    if (n === null || n === undefined) return '0';
                    return n.toLocaleString();
                }
            }
        }
    </script>
</body>
</html>
