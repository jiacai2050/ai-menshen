listen = ":8080"
verbose = false

[web]
listen = ":8081"

[auth]
enable = false
# Used for browser-based Dashboard access (User:Password)
user = "admin"
password = "your-password-here"  # supports ${ENV}
# Used for API proxying (Authorization: Bearer <token> or x-api-key: <token>)
# Note: When auth is enabled, incoming auth headers matching the gateway token are
# consumed by the gateway and stripped before forwarding to upstreams. If upstreams
# require credentials, configure them in [providers.<name>].api_key / headers.
token = "sk-your-proxy-token"  # supports ${ENV}

# Providers are keyed by name: [providers.<name>]. The name is used in logs
# and the audit database to identify the provider. Names must match
# [A-Za-z0-9_-]+ and must be unique (duplicate tables are a TOML error).
[providers.openai]
base_url = "https://api.openai.com/v1"
api_key = "${OPENAI_API_KEY}"  # supports ${ENV}
# Optional: override the client's model before forwarding upstream.
# model = "gpt-4.1"
# Request distribution weight (set to 0 to disable this provider)
weight = 1
# Optional: protocol capabilities supported by this provider (default: ["openai-completions"])
# Supported: "openai-completions", "anthropic-messages"
# capabilities = ["openai-completions"]
# Optional: HTTP/SOCKS5 proxy for this provider (empty = use HTTP_PROXY/HTTPS_PROXY env vars)
# proxy = "http://127.0.0.1:7890"  # supports ${ENV}
# Optional: custom headers (useful for Cloudflare AI Gateway BYOK)
# headers = { "cf-aig-authorization" = "Bearer ${CLOUDFLARE_API_KEY}" }  # values support ${ENV}

# Add more [providers.<name>] tables for weighted load balancing and failover.
# Failover tries heavier providers first (ties broken by name).
# [providers.deepseek]
# base_url = "https://api.deepseek.com"
# api_key = "${DEEPSEEK_API_KEY}"
# weight = 2

# Native Anthropic Claude provider
# [providers.claude]
# base_url = "https://api.anthropic.com/v1"
# api_key = "${ANTHROPIC_API_KEY}"
# capabilities = ["anthropic-messages"]
# weight = 1

[upstream]
# Upstream request timeout in seconds (default: 300)
# timeout = 300
# Max idle connections per upstream host (default: 8)
# max_idle_conns_per_host = 8

[failover]
# Automatically retry with next provider on network errors, HTTP 5xx, or 429 (default: true)
# enable = true

[storage]
retention_days = 90

[storage.sqlite]
path = "./data/menshen.db"  # supports ${ENV}

[cache]
enable = true
# Skip caching responses larger than this size (bytes, 0 = no limit)
max_body_bytes = 5242880
# Cache TTL in seconds (0 = never expire)
# max_age = 0

[logging]
# Persist full request body in DB (disable to save disk / for privacy)
# log_request_body = true
# Persist full response body in DB (also required for cache hits to return body)
# log_response_body = true
